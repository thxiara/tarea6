<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administrador</title>
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/styles.css" rel="stylesheet">
  </head>
  <body>
    <header>
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="../assets/iconos/kitty diente professional malvada.svg" alt="Logo Kitty" class="logo-navbar">
                </a>
                <a class="navbar-brand" href="index.html">Nombre</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuBurger" aria-controls="menuBurger" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>               
                <div class="collapse navbar-collapse" id="menuBurger">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item me-3">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link active" aria-current="page" href="#">Panel de Admin</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Page 3</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="container mt-5 pt-5 mb-5">
            <div class="row">
                <div class="col-12">
                    <h2 class="mb-4 text-center text-lg-start">Panel de admin</h2>
                    <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="horarios-tab" data-bs-toggle="tab" data-bs-target="#horarios" type="button" role="tab" aria-controls="horarios" aria-selected="true">
                                Horarios
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="medico-tab" data-bs-toggle="tab" data-bs-target="#medico" type="button" role="tab" aria-controls="medico" aria-selected="false">
                                Médicos
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content p-4 border border-top-0 bg-white rounded-bottom shadow-sm" id="Tabsadmin">
                        
                        <div class="tab-pane show active" id="horarios" role="tabpanel" aria-labelledby="horarios-tab" tabindex="0">
                            <h3 class="mb-4">Agenda del Día</h3>
                            
                            <div class="table-responsive">
                                <table class="table table-striped table-hover align-middle">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Hora</th>
                                            <th>Paciente</th>
                                            <th>Odontólogo</th>
                                            <th>Motivo</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>03:00 AM</td>
                                            <td>Pepe</td>
                                            <td>Hello kitty</td>
                                            <td>Control</td>
                                            <td>
                                                <button type="button" class="btn boton boton-a btn-sm" data-bs-toggle="modal" data-bs-target="#modalAcciones">
                                                    Gestionar
                                                </button>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>16:07 PM</td>
                                            <td>Fulanito</td>
                                            <td>Hello kitty</td>
                                            <td>Limpieza</td>
                                            <td>
                                                <button type="button" class="btn boton boton-a btn-sm" data-bs-toggle="modal" data-bs-target="#modalAcciones">
                                                    Gestionar
                                                </button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="tab-pane" id="medico" role="tabpanel" aria-labelledby="medico-tab" tabindex="0">
                            <h3 class="mb-4">Registrar Nuevo Odontólogo</h3>
                            
                            <form>
                                <div class="row g-3 mb-3">
                                    <div class="col-12 col-md-6">
                                        <label for="nombre" class="form-label">Nombre Completo</label>
                                        <input type="text" class="form-control" id="nombreDoc" placeholder="ej: juancito">
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="matricula" class="form-label">Número de Matrícula</label>
                                        <input type="text" class="form-control" id="matricula" placeholder="ej: 12345">
                                    </div>
                                </div>
                                <div class="row g-3 mb-4">
                                    <div class="col-12 col-md-6">
                                        <label for="especialidadDoc" class="form-label">Especialidad</label>
                                        <select class="form-select" id="especialidadDoc">
                                            <option selected disabled value="">Seleccionar especialidad...</option>
                                            <option value="1">Odontología General</option>
                                            <option value="2">Pediatría</option>
                                            <option value="3">Especialista en encías</option>
                                            <option value="4">Cirujano</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-md-6">
                                        <label for="horariosDoc" class="form-label">Horarios</label>
                                        <input type="text" class="form-control" id="horariosDoc" placeholder="ej: lunes a viernes, 09:00 - 17:00">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-12 text-end">
                                        <button type="submit" class="btn boton boton-a">Guardar</button>
                                    </div>
                                </div>
                            </form>
                        </div>

                    </div> </div>
            </div>
        </section>
    </main>

    <div class="modal" id="modalAcciones" tabindex="-1" aria-labelledby="modalAccionesLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalAccionesLabel">Gestión de cita</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p>Elija una acción</p>
                </div>
                <div class="modal-footer justify-content-between">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <div>
                        <button type="button" class="btn btn-danger me-2">Borrar cita</button>
                        <button type="button" class="btn boton boton-a">Editaf cita</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="container-fluid p-5 mt-auto">
        <div class="row text-center">
            <div class="col-12"><p>by Iara & Felipe :3</p></div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
